<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Custom Webkit 14.02</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.3);
            width: 90%;
            max-width: 400px;
        }
        h1 { margin-bottom: 20px; font-size: 24px; color: #00aaFF; }
        .status { 
            margin-bottom: 20px; 
            padding: 10px; 
            background: #252525; 
            border-radius: 8px; 
            font-size: 14px;
            border-left: 4px solid #555;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: linear-gradient(45deg, #0060a8, #00aaFF);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn:hover { opacity: 0.9; }
        .info { font-size: 12px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 PS4 Custom Exploit</h1>
    
    <!-- Zone de statut -->
    <div id="fw-status" class="status">Détection du Firmware...</div>

    <!-- Bouton Principal -->
    <button id="exploit-btn" class="btn" onclick="launchExploit()">Lancer le Jailbreak</button>
    
    <div class="info">Fait maison - FW 14.02 Supporté</div>
</div>

<script>
    // --- CONFIGURATION PERSONNELLE ---
    // URL vers tes fichiers JS si tu veux séparer le code plus tard
    const EXPLOIT_URL = ""; 

    // Fonction de détection automatique du firmware
    function detectFirmware() {
        const fwMatch = document.cookie.match(/webbrowser_fw=(\d+\.\d+)/);
        const statusEl = document.getElementById('fw-status');
        
        if (fwMatch) {
            const fw = fwMatch[1];
            if (fw === "14.02") {
                statusEl.innerHTML = "✅ Firmware détecté : <strong>14.02</strong>";
                statusEl.style.borderLeftColor = "#00ff00";
            } else {
                statusEl.innerHTML = "⚠️ Firmware détecté : <strong>" + fw + "</strong><br>Ce payload est optimisé pour le 14.02.";
                statusEl.style.borderLeftColor = "#ffcc00";
            }
        } else {
            statusEl.innerHTML = "ℹ️ Firmware inconnu. L'exploit tentera une détection automatique.";
            statusEl.style.borderLeftColor = "#00aaFF";
        }
    }

    // Fonction principale de lancement
    function launchExploit() {
        const btn = document.getElementById('exploit-btn');
        btn.innerText = "Exploitation en cours...";
        btn.disabled = true;

        // Méthode standard d'appel de l'exploit webkit
        // On charge le script d'exploitation directement dans le contexte du navigateur
        try {
            // Création dynamique du script pour éviter les blocages CORS simples
            const script = document.createElement('script');
            
            // Utilisation du payload direct ou via un lien externe
            // Ici, on utilise la méthode universelle qui force le crash contrôlé
            window.location.href = "https://jeef2x.github.io/webkit1402/PS4_1402_v3/"; 
            
            // Alternative locale si tu as mis le fichier à côté :
            // window.location.href = "./webkit_payload.js";

        } catch (e) {
            alert("Erreur lors du lancement : " + e);
            btn.innerText = "Réessayer";
            btn.disabled = false;
        }
    }

    // Initialisation au chargement
    window.onload = detectFirmware;
</script>

</body>
</html>
